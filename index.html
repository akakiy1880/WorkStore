<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#EEF1F5">
    <title>Офис Маркет</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.uzum.uz" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Тему ставим до отрисовки, чтобы страница не мигала
        (() => {
            let theme = null;
            try { theme = localStorage.getItem('theme'); } catch { /* хранилище недоступно */ }
            document.documentElement.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        })();
    </script>
</head>

<body>
    <div id="page">
        <header class="top">
            <div class="brand">
                <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.3 11h10.4l2-8H6.5"/><circle cx="9.5" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/></svg></span>
                <div>
                    <h1 class="brand-name">Офис Маркет</h1>
                    <div class="brand-sub">Самообслуживание</div>
                </div>
            </div>
            <a class="icon-btn" href="https://forms.gle/PtGTZbj7RKDz5hT48" target="_blank" rel="noopener" aria-label="Заявка на новый товар"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg></a>
            <button type="button" class="icon-btn theme-btn" id="theme-toggle" data-action="theme" aria-label="Переключить тему">
                <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
                <svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
            </button>
        </header>

        <div class="tools">
            <label class="search">
                <span class="sr">Поиск товаров</span>
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" id="search" placeholder="Поиск товаров" autocomplete="off">
            </label>
            <label class="sort">
                <span class="sr">Сортировка</span>
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
                <select id="sort">
                    <option value="default">По умолчанию</option>
                    <option value="new">Новые товары</option>
                    <option value="cheaper">Дешевле</option>
                    <option value="expensive">Дороже</option>
                </select>
            </label>
        </div>

        <nav class="chips" id="categories" aria-label="Категории товаров"></nav>
        <main class="grid" id="products"></main>
    </div>

    <div class="scrim" id="cart-scrim" data-action="close-cart"></div>

    <!-- На телефоне лента снизу и шторка над ней, на десктопе постоянная колонка справа -->
    <aside class="receipt" id="receipt" aria-label="Корзина и оплата">
        <section class="items sheet" id="cart-items" aria-labelledby="cart-title">
            <div class="sheet-handle" id="cart-handle"></div>
            <div class="items-head">
                <h2 class="items-title" id="cart-title">Корзина</h2>
                <button type="button" class="link-btn" id="clear-cart" data-action="ask-clear" hidden>Очистить</button>
                <button type="button" class="icon-btn items-close" id="cart-close" data-action="close-cart" aria-label="Закрыть корзину"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            </div>
            <div class="lines" id="cart-lines"></div>
        </section>

        <div class="pay">
            <div class="pay-row">
                <button type="button" class="pay-cart" id="pay-cart" data-action="toggle-cart" aria-expanded="false" aria-controls="cart-items" aria-label="Открыть корзину">
                    <span class="pay-caption"><span id="pay-caption">Корзина пуста</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></span>
                    <span class="pay-sum mono"><span id="pay-sum">0</span> <span class="unit">сум</span></span>
                </button>
                <button type="button" class="copy copy-sum" id="copy-sum" data-action="copy-sum">
                    <span class="copy-icons">
                        <svg class="ico page" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                        <svg class="ico check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
                    </span>
                    <span id="copy-sum-label">Копировать сумму</span>
                </button>
            </div>
            <div class="pay-row">
                <button type="button" class="copy copy-card" id="copy-card" data-action="copy-card" aria-label="Скопировать номер карты">
                    <span class="copy-card-text">
                        <span class="copy-card-cap" id="copy-card-cap">Карта</span>
                        <span class="copy-card-num mono">9860 2466 0280 6837</span>
                    </span>
                    <span class="copy-icons">
                        <svg class="ico page" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                        <svg class="ico check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
                    </span>
                </button>
                <a class="click-btn" id="pay-click" href="https://my.click.uz/clickp2p/B3631576DEADC7D71F0A8FF521024D64C70852638D953480E35DB4EAE0DF5F5E">Оплатить в&nbsp;CLICK</a>
            </div>
        </div>
    </aside>

    <div class="scrim over" id="product-scrim" data-action="close-product"></div>
    <section class="product sheet" id="product" role="dialog" aria-modal="true" aria-labelledby="product-name">
        <div class="sheet-handle" id="product-handle"></div>
        <div class="product-photo" id="product-gallery">
            <img id="product-img" src="data:," alt="">
            <button type="button" class="gal-btn prev" data-action="gallery-prev" aria-label="Предыдущее фото"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
            <button type="button" class="gal-btn next" data-action="gallery-next" aria-label="Следующее фото"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
            <div class="gal-dots" id="gallery-dots"></div>
            <button type="button" class="icon-btn product-close" id="product-close" data-action="close-product" aria-label="Закрыть"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="product-body">
            <div class="product-head">
                <div>
                    <h2 class="product-name" id="product-name"></h2>
                    <div class="product-size" id="product-size"></div>
                </div>
                <div class="product-cost">
                    <s class="old mono" id="product-old"></s>
                    <div class="product-price mono"><span id="product-price"></span> <span class="unit">сум</span></div>
                </div>
            </div>
            <p class="product-text" id="product-text"></p>
            <div id="product-facts"></div>
            <div id="product-control"></div>
        </div>
    </section>

    <div class="scrim top-most" id="confirm-scrim" data-action="cancel-clear"></div>
    <div class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <h3 id="confirm-title">Очистить корзину?</h3>
        <p>Все выбранные товары будут удалены.</p>
        <div class="confirm-row">
            <button type="button" id="confirm-cancel" data-action="cancel-clear">Отмена</button>
            <button type="button" class="danger" data-action="do-clear">Очистить</button>
        </div>
    </div>

    <div class="fly" id="fly" aria-hidden="true"></div>
    <span class="sr" id="status" role="status"></span>

    <script src="products.js"></script>
    <script src="app.js"></script>
</body>

</html>
